name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate composer manifest
        run: composer validate --strict

      - name: PHP syntax check
        run: composer run lint:php
